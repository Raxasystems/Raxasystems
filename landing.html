<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace | RaXa Systems</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script>
  // same light/dark choice as the other pages; also loads the matching module stylesheet
  (function () {
    var t = null;
    try { t = localStorage.getItem("raxa-theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.id = "moduleCss"; l.href = "assets/module1" + t + ".css";
    document.head.appendChild(l);
  })();
</script>
<style>
:root{--bg:#fff;--sec:#f1f6fc;--ink:#12263a;--sub:#4a5d70;--rx-blue:#2f72bf;--rx-lime:#95d600;--rx-ico:#1f64ad;--rx-tile-bg:#fff;--rx-tile-text:#12263a;--rx-cloud-1:#fff;--rx-cloud-2:#eaf2fb;--trial:#ff7a45;--trial-late:#ff4d4f;--nav-bg:#12263a;--line:#c5d3e2}
:root[data-theme="dark"]{--bg:#0b1826;--sec:#0f2031;--ink:#eef1f7;--sub:#9fb2c6;--rx-blue:#3d86d6;--rx-ico:#7db8f0;--rx-tile-bg:#14293e;--rx-tile-text:#eef1f7;--rx-cloud-1:#1a3652;--rx-cloud-2:#11263a;--line:#2c4a68}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;display:flex;flex-direction:column;background:var(--sec);color:var(--ink);font:500 clamp(16px,.4vw + 14px,18px)/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
button{font-family:inherit}

/* top bar */
.nav{position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:64px;padding:8px clamp(16px,5vw,64px);padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--nav-bg)}
.user{display:flex;align-items:center;gap:12px;min-width:0;padding:4px 10px 4px 4px;background:none;border:0;border-radius:99px;color:inherit;text-align:left;cursor:pointer}
.user:hover{background:rgba(255,255,255,.09)}
.avatar{flex:none;display:grid;place-items:center;width:40px;height:40px;background:var(--rx-lime);color:#12263a;border-radius:50%;font-weight:800;font-size:17px}
.who-name{display:block;color:#eef1f7;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(46vw,320px)}
.who-id{display:block;color:#9fb2c6;font-weight:700;font-size:12.5px}
.who-id a{color:inherit}
.trial{padding:.45em 1em;color:var(--trial);border:2px solid var(--trial);border-radius:99px;font:800 14px inherit;white-space:nowrap}
.trial.is-ended{color:var(--trial-late);border-color:var(--trial-late)}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.logout,.theme{background:transparent;color:#eef1f7;border:2px solid var(--rx-lime);cursor:pointer}
.logout{padding:.5em 1.1em;border-radius:99px;font:700 14px inherit;text-decoration:none;white-space:nowrap}
.theme{display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:50%}
.logout:hover,.theme:hover{background:var(--rx-lime);color:#12263a}
.theme svg{width:20px;height:20px}
.theme .i-sun{display:none}
:root[data-theme="dark"] .theme .i-sun{display:block}
:root[data-theme="dark"] .theme .i-moon{display:none}

/* page */
.band{flex:1;padding:clamp(28px,5vw,64px) clamp(16px,5vw,64px)}
.wrap{max-width:1280px;margin:0 auto}
.band h2{margin:0 0 6px;font-size:clamp(32px,5vw,56px);letter-spacing:-.03em;font-weight:800}
.band p.lead{margin:0 0 28px;color:var(--sub)}
:is(a,button):focus-visible{outline:3px solid #ffb703;outline-offset:3px}

/* read-only profile pop-up */
dialog{width:min(400px,calc(100% - 24px));padding:0;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:24px}
dialog::backdrop{background:rgba(8,18,30,.58)}
.pf-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.pf-head h3{margin:0;font-size:22px;font-weight:800}
.pf-x{width:36px;height:36px;background:var(--sec);color:var(--ink);border:2px solid var(--line);border-radius:50%;font-size:18px;cursor:pointer}
.pf-body{margin:0;padding:12px 20px 20px}
.pf-row{padding:10px 0;border-top:1px solid var(--line)}
.pf-row:first-child{border-top:0}
.pf-lab{display:block;color:var(--sub);font-weight:700;font-size:12.5px}
.pf-val{display:block;font-weight:800;overflow-wrap:anywhere}
</style>
</head>
<body>

<header class="nav">
  <button class="user" id="profileBtn" type="button" aria-haspopup="dialog" aria-label="Open your profile">
    <span class="avatar" id="avatar" aria-hidden="true">R</span>
    <span>
      <span class="who-name" id="userName">Loading&hellip;</span>
      <span class="who-id" id="accountId">&nbsp;</span>
    </span>
  </button>
  <span class="trial" id="trial" role="status">Trial: -- days left</span>
  <div class="nav-actions">
    <button class="theme" id="themeBtn" type="button" aria-label="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="logout" id="logoutBtn" href="login.html">Log out</a>
  </div>
</header>

<main class="band">
  <div class="wrap">
    <h2>Your workspace</h2>
    <p class="lead">Open any module from the cloud.</p>
    <div class="rx-map">
          <div class="rx-cloudbox">

            <!-- desktop: wires + cloud -->
            <svg class="rx-wires" viewBox="0 0 1600 800" aria-hidden="true">
              <defs>
                <filter id="rxShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14283c" flood-opacity=".18"/></filter>
                <linearGradient id="rxCloudFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" style="stop-color:var(--rx-cloud-1,#fff)"/>
                  <stop offset="1" style="stop-color:var(--rx-cloud-2,#eaf2fb)"/>
                </linearGradient>
                <path id="rxW1" d="M435 260V318Q435 338 455 338H650"/>
                <path id="rxW2" d="M270 400H570"/>
                <path id="rxW3" d="M270 660H430"/>
                <path id="rxW4" d="M800 232V300"/>
                <path id="rxW5" d="M1165 260V318Q1165 338 1145 338H980"/>
                <path id="rxW6" d="M1330 400H1080"/>
                <path id="rxW7" d="M1330 660H1180"/>
              </defs>

              <g>
                <use href="#rxW1" class="rx-wire"/>
                <use href="#rxW2" class="rx-wire"/>
                <use href="#rxW3" class="rx-wire"/>
                <use href="#rxW4" class="rx-wire"/>
                <use href="#rxW5" class="rx-wire"/>
                <use href="#rxW6" class="rx-wire"/>
                <use href="#rxW7" class="rx-wire"/>
              </g>

              <g filter="url(#rxShadow)">
                <path d="M520 740C400 740 340 680 340 600C340 520 400 470 470 460C470 380 540 330 620 340C650 270 730 230 810 240C900 250 950 300 960 350C1050 330 1130 380 1140 450C1220 460 1270 520 1270 600C1270 690 1200 740 1120 740Z"
                      fill="url(#rxCloudFill)" stroke="var(--rx-blue,#2f72bf)" stroke-width="9" stroke-linejoin="round"/>
              </g>

              <g>
                <circle class="rx-dot" cx="435"  cy="260" r="7"/>
                <circle class="rx-dot" cx="270"  cy="400" r="7"/>
                <circle class="rx-dot" cx="270"  cy="660" r="7"/>
                <circle class="rx-dot" cx="800"  cy="232" r="7"/>
                <circle class="rx-dot" cx="1165" cy="260" r="7"/>
                <circle class="rx-dot" cx="1330" cy="400" r="7"/>
                <circle class="rx-dot" cx="1330" cy="660" r="7"/>
              </g>
            </svg>

            <!-- phone: cloud only -->
            <svg class="rx-cloud-m" viewBox="320 220 960 540" aria-hidden="true">
              <defs>
                <filter id="rxShadowM" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14283c" flood-opacity=".18"/></filter>
                <linearGradient id="rxCloudFillM" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" style="stop-color:var(--rx-cloud-1,#fff)"/>
                  <stop offset="1" style="stop-color:var(--rx-cloud-2,#eaf2fb)"/>
                </linearGradient>
              </defs>
              <g filter="url(#rxShadowM)">
                <path d="M520 740C400 740 340 680 340 600C340 520 400 470 470 460C470 380 540 330 620 340C650 270 730 230 810 240C900 250 950 300 960 350C1050 330 1130 380 1140 450C1220 460 1270 520 1270 600C1270 690 1200 740 1120 740Z"
                      fill="url(#rxCloudFillM)" stroke="var(--rx-blue,#2f72bf)" stroke-width="9" stroke-linejoin="round"/>
              </g>
            </svg>

            <div class="rx-logo" role="img" aria-label="RaXa"></div>
          </div>

          <!-- Module tiles: change each href to where that module should open -->
            <nav class="rx-tiles" aria-label="Modules">

              <a class="rx-tile" href="#human-resource" data-module="human-resource" style="--x:19.94%;--y:7.5%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <circle cx="0" cy="-4" r="11"/><path d="M-22 40Q-22 12 0 12Q22 12 22 40"/>
                  <circle cx="-38" cy="4" r="8"/><path d="M-52 40Q-52 18 -38 18Q-30 18 -26 22"/>
                  <circle cx="38" cy="4" r="8"/><path d="M52 40Q52 18 38 18Q30 18 26 22"/>
                  <rect class="rx-hl" x="10" y="-44" width="38" height="26" rx="5"/><path class="rx-hl" d="M30 -34H42M30 -27H42"/><circle cx="20" cy="-34" r="3.5"/>
                </svg>
                <b>Human Resource</b>
              </a>

              <a class="rx-tile" href="#customers-sales" data-module="customers-sales" style="--x:3.75%;--y:37.5%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <circle cx="-22" cy="-14" r="11"/><path d="M-46 38Q-46 8 -22 8Q2 8 2 38Z"/>
                  <rect x="14" y="20" width="10" height="18"/><rect x="30" y="8" width="10" height="30"/>
                  <path class="rx-hl" d="M12 -2L26 -16L46 -34M34 -34H46V-22"/>
                </svg>
                <b>Customers and Sales</b>
              </a>

              <a class="rx-tile" href="#inventory-logistics" data-module="inventory-logistics" style="--x:3.75%;--y:70%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <rect x="-50" y="-14" width="34" height="30" rx="2"/><path d="M-50 -4H-16M-33 -14V-4"/>
                  <path d="M-8 -8H22V22H-8Z"/><path d="M22 2H38L48 12V22H22Z"/>
                  <circle class="rx-fill" cx="4" cy="26" r="6"/><circle class="rx-fill" cx="38" cy="26" r="6"/>
                  <path class="rx-hl" d="M-52 28H-34M-48 36H-34"/>
                </svg>
                <b>Inventory and Logistics</b>
              </a>

              <a class="rx-tile rx-tile--lg" href="#customer-experience" data-module="customer-experience" style="--x:41.75%;--y:1%;--w:16.5%;--h:28%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <path d="M-34 -30H34Q44 -30 44 -20V14Q44 24 34 24H0L-18 40V24H-34Q-44 24 -44 14V-20Q-44 -30 -34 -30Z"/>
                  <path d="M-16 -12V-4M16 -12V-4"/><path d="M-18 6Q0 20 18 6"/>
                  <path class="rx-hl" d="M46 -40C46 -46 38 -48 38 -42C38 -48 30 -46 30 -40C30 -35 38 -31 38 -31C38 -31 46 -35 46 -40Z"/>
                </svg>
                <b>Customer Experience</b>
              </a>

              <a class="rx-tile" href="#purchase-expenses" data-module="purchase-expenses" style="--x:65.56%;--y:7.5%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <path d="M-50 -34H-36L-26 16H26L36 -18H-32"/>
                  <circle class="rx-fill" cx="-16" cy="30" r="6"/><circle class="rx-fill" cx="18" cy="30" r="6"/>
                  <circle class="rx-hl" cx="4" cy="-8" r="11"/><path class="rx-hl" d="M4 -14V-2M0 -10H8"/>
                </svg>
                <b>Purchase and Expenses</b>
              </a>

              <a class="rx-tile" href="#dashboard" data-module="dashboard" style="--x:83.125%;--y:37.5%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <rect x="-48" y="-38" width="96" height="76" rx="6"/><path d="M-48 -22H48"/>
                  <path d="M-34 28V6M-24 28V-4M-14 28V12"/>
                  <path class="rx-hl" d="M4 22L16 8L26 16L40 -6"/>
                </svg>
                <b>Dashboard</b>
              </a>

              <a class="rx-tile" href="management.html" data-module="management" style="--x:83.125%;--y:70%">
                <span class="rx-ext">&rarr;</span>
                <svg viewBox="-58 -50 116 100" aria-hidden="true">
                  <path d="M-44 -24H44M-44 0H44M-44 24H44"/>
                  <circle class="rx-fill" cx="-18" cy="-24" r="8"/>
                  <circle class="rx-fill rx-hl" cx="16" cy="0" r="8"/>
                  <circle class="rx-fill" cx="-2" cy="24" r="8"/>
                </svg>
                <b>Management</b>
              </a>

            </nav>
  </div>
</main>

<dialog id="pfDlg" aria-labelledby="pfTitle">
  <div class="pf-head"><h3 id="pfTitle">Profile</h3><button class="pf-x" id="pfClose" type="button" aria-label="Close">&times;</button></div>
  <div class="pf-body" id="pfBody"></div>
</dialog>

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbxKI9W4narvcHMqxpW1nM8sSsLmcIGCywGV5-8iYpgi15cAW9SVXp7UEr7bWwWgieT10w/exec";
  var TRIAL_DAYS = 52;
  var $ = function (i) { return document.getElementById(i); };
  function store(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function clearSession() { try { ["raxa-token", "raxa-account-id", "raxa-user-name"].forEach(function (k) { sessionStorage.removeItem(k); }); } catch (e) {} }
  function post(p) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) }).then(function (r) { return r.json(); });
  }

  // theme: switches the page and the module stylesheet together
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    var css = $("moduleCss"), href = "assets/module1" + t + ".css";
    if (css && css.getAttribute("href") !== href) css.setAttribute("href", href);
    try { localStorage.setItem("raxa-theme", t); } catch (e) {}
  }
  $("themeBtn").onclick = function () { applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); };

  // log out: end the server session, forget it here, go back to sign in
  $("logoutBtn").onclick = function (e) {
    e.preventDefault();
    var tk = store("raxa-token"), href = this.getAttribute("href");
    if (tk) post({ action: "logout", token: tk }).catch(function () {});
    clearSession();
    setTimeout(function () { location.replace(href); }, 200);
  };

  // header
  function showUser(name, id) {
    $("userName").textContent = name;
    $("accountId").textContent = id ? "Account ID: " + id : "";
    $("avatar").textContent = (name.trim().charAt(0) || "R").toUpperCase();
  }
  function fail(msg) { showUser(msg, ""); $("accountId").innerHTML = '<a href="login.html">Sign in</a>'; }
  function showTrial(signup) {
    var d = new Date(signup);
    if (isNaN(d)) return;
    var today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var left = Math.max(0, TRIAL_DAYS - Math.max(0, Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000)));
    $("trial").textContent = "Trial: " + (left < 10 ? "0" : "") + left + " days left";
    $("trial").classList.toggle("is-ended", left === 0);
  }

  var token = store("raxa-token"), id = store("raxa-account-id"), client = null;
  if (!token) return fail("Please sign in");
  showUser(store("raxa-user-name") || "Loading\u2026", id);

  // client row for the signed-in account (the server finds it from the token)
  post({ action: "me", token: token }).then(function (res) {
    if (!res || !res.ok) { if (res && res.code === "unauthorized") { clearSession(); throw new Error("Session expired"); } throw new Error((res && res.error) || "Account not found"); }
    client = res.client || {};
    var date = "";
    for (var k in client) if (/date|created|signup/i.test(k) && client[k]) { date = client[k]; break; }
    if (date) showTrial(date);
  }).catch(function (ex) { if (/expired/i.test(ex.message)) fail("Session expired"); });

  // profile pop-up (read only)
  $("profileBtn").onclick = function () {
    var body = $("pfBody"); body.textContent = "";
    var rows = client || { "Account ID": id, Name: store("raxa-user-name") };
    Object.keys(rows).forEach(function (k) {
      if (/pass|pwd|hash|token|secret|salt|otp/i.test(k) || rows[k] === "" || rows[k] == null) return;
      var r = document.createElement("div"), l = document.createElement("span"), v = document.createElement("span");
      r.className = "pf-row"; l.className = "pf-lab"; v.className = "pf-val";
      l.textContent = k; v.textContent = String(rows[k]); r.appendChild(l); r.appendChild(v); body.appendChild(r);
    });
    $("pfDlg").showModal();
  };
  $("pfClose").onclick = function () { $("pfDlg").close(); };
  $("pfDlg").addEventListener("mousedown", function (e) { if (e.target === this) this.close(); });
})();
</script>
</body>
</html>
